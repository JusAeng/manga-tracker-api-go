name: deploy gcloud

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: code checkout
        uses: actions/checkout@v2

      - name: install the gcloud cli
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}
          service_account_key: $ {{ secrets.GOOGLE_CLOUD_KEY }}
          export_default_credentials: true

      - name: build docker image
        run: docker build -t asia-southeast1-docker.pkg.dev/$GOOGLE_PROJECT/mgt-backend/mgt-backend-deploy:latest .

      - name: push to gcloud
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          docker push asia-southeast1-docker.pkg.dev/$GOOGLE_PROJECT/mgt-backend/mgt-backend-deploy:latest
          
      - name: deploy on gcloud run
        run: ls
