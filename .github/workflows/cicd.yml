name: Build and Deploy to Cloud Run

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: manga-tracker-app-io
  GAR_LOCATION: asia-southeast1-docker.pkg.dev/manga-tracker-app-io/mgt-backend
  SERVICE: mgt-backend-deploy
  REGION: asia-southeast1

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Alternative option - authentication via credentials json
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.SERVICE_ACCOUNT_KEY }}"

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Authen Docker to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}
          username: _json_key
          password: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}/mgt-backend-deploy" ./
          docker push "${{ env.GAR_LOCATION }}/mgt-backend-deploy"
          ls -la

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/mgt-backend-deploy:latest
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LINECLIENTID=${{ secrets.LINECLIENTID }}
            JWT_SIGNED_STRING=${{ secrets.JWT_SIGNED_STRING }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
