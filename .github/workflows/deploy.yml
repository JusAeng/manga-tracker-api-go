name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@master
        with:
          project_id: totemic-life-417117
          service_account_key: ${{ secrets.GOOGLE_CLOUD_KEY }}
          export_default_credentials: true

      - name: Build and deploy to Cloud Run
        run: |
          gcloud builds submit --tag gcr.io/totemic-life-417117/my-image
          gcloud run deploy my-service --image gcr.io/totemic-life-417117/my-image --platform managed --region asia-southeast1
