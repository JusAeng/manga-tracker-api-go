name: Build and Deploy to Cloud Run

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: totemic-life-417117 # TODO: update Google Cloud project id
  GAR_LOCATION: asia-southeast1-docker.pkg.dev/totemic-life-417117/mgt-backend # TODO: update Artifact Registry location
  SERVICE: mgt-backend-deploy # TODO: update Cloud Run service name
  REGION: asia-southeast1 # TODO: update Cloud Run service region

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Alternative option - authentication via credentials json
      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.SERVICE_ACCOUNT_KEY }}"

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}
          username: _json_key
          password: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}/mgt-backend-deploy" ./
          docker push "${{ env.GAR_LOCATION }}/mgt-backend-deploy"

      - name: Deploy to Cloud Run
        id: deploy
        run: gcloud run deploy ${{ env.SERVICE }} --image ${{ env.GAR_LOCATION }}/mgt-backend-deploy:latest

        # uses: google-github-actions/deploy-cloudrun@v2
        # with:
        #   service: ${{ env.SERVICE }}
        #   region: ${{ env.REGION }}
        #   # NOTE: If using a pre-built image, update the image name here
        #   image: ${{ env.GAR_LOCATION }}/mgt-backend-deploy:latest

      # If required, use the Cloud Run url output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
